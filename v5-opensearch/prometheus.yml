# Prometheus config: unchanged from v2. It scrapes the collector, not the Spring app.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]   # container name + port
        labels:
          env: local

  - job_name: prometheus                   # Prometheus monitoring itself (optional)
    static_configs:
      - targets: ["localhost:9090"]
