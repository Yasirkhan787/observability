global:
  scrape_interval: 5s        # how often to pull metrics (15s is typical in prod)
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]   # management port, not 8080
        labels:
          env: local

  - job_name: prometheus                         # Prometheus monitoring itself (optional)
    static_configs:
      - targets: ["localhost:9090"]