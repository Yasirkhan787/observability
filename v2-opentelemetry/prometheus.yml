# =====================================================================
# Prometheus config
# v1: scraped the Spring app at /actuator/prometheus
# v2: scrapes the OTel Collector (the app no longer has that endpoint)
# =====================================================================

global:
  scrape_interval: 5s        # how often to pull metrics (15s is typical in production)
  evaluation_interval: 5s    # how often to evaluate alert/recording rules (none yet)

scrape_configs:

  - job_name: otel-collector            # becomes the label job="otel-collector" on every metric
    metrics_path: /metrics              # collector's Prometheus exporter serves plain /metrics
    static_configs:
      - targets: ["otel-collector:8889"]   # container name + port; works because both are in the same compose network
        labels:
          env: local                    # extra label added to every metric from this target

  - job_name: prometheus                # Prometheus monitoring itself (optional, handy for debugging)
    static_configs:
      - targets: ["localhost:9090"]     # "localhost" here = inside the Prometheus container itself
